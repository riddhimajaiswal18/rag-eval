[project]

name = "rag-and-eval"

version = "0.1.0"

description = "RAG research and evaluation project"

requires-python = ">=3.10"

dependencies = [
    # Corpus / preprocessing
    "pypdf>=6.0.0",
    "requests>=2.32.0",
    "tiktoken>=0.9.0",

    # Numerical / data handling
    "numpy>=1.26.0",
    "pandas>=2.2.0",

    # Embedding models
    "torch>=2.10.0",
    "transformers>=4.51.0",
    "sentence-transformers>=2.7.0",
    "bitsandbytes>=0.45.0",
    "accelerate>=1.0.0",

    # RAG evaluation
    "deepeval>=3.0.0",

    # Vector database
    "qdrant-client>=1.15.0",

    # Environment configuration
    "python-dotenv>=1.0.0",
]

[tool.uv]

package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }